# Build backend
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
# Package metadata
[project]
name = "pv-emi"
version = "0.1.0"
description = "Measurement-based EMI modeling of photovoltaic power systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manish Prajapati" }]
keywords = [
    "EMI",
    "EMC",
    "photovoltaic",
    "noise source",
    "conducted emission",
    "radiated emission",
    "in-circuit impedance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
 
# Runtime dependencies
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
 
# Development tools
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
 
[project.urls]
Repository = "https://github.com/MP-Forge/pv-emi"
Issues = "https://github.com/MP-Forge/pv-emi/issues"
 
[tool.setuptools.packages.find]
where = ["src"]
 
# pytest settings
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
 
# Ruff settings
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
 
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "NPY", "SIM"]